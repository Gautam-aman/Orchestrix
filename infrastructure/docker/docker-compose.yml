services:
  postgres:
    image: postgres:16
    container_name: orchestrix-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: orchestrix
      POSTGRES_USER: orchestrix
      POSTGRES_PASSWORD: orchestrix

    ports:
      - "5432:5432"

    volumes:
      - orchestrix_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrix -d orchestrix"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  orchestrix_postgres_data: